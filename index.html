<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiplication Battleship — Pass & Play</title>
<style>
:root{--bg:#081729;--panel:#10253c;--panel2:#15334f;--line:#31516c;--sea:#16446b;--sea2:#1e5683;--ink:#f0f7ff;--muted:#a8c1d5;--gold:#ffd46e;--mint:#55e0b0;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0%,#164268,var(--bg) 63%);color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}.shell{max-width:1160px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.brand{font-weight:900;letter-spacing:.04em;font-size:clamp(21px,3vw,32px)}.sub{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}.chip{padding:9px 13px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:13px}.panel{background:rgba(16,37,60,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 36px #0004}.center{max-width:610px;margin:6vh auto;text-align:center}.center h1{font-size:clamp(30px,5vw,52px);line-height:1.1;margin:12px 0}.center p{line-height:1.6;color:var(--muted)}.bigicon{font-size:60px;margin:12px}.btn{background:var(--gold);color:#102034;border:0;border-radius:11px;padding:12px 19px;font-weight:800}.btn.secondary{background:#1c4362;color:var(--ink);border:1px solid #48718f}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:20px}.field{display:flex;flex-direction:column;text-align:left;gap:5px;color:var(--muted);font-size:13px;flex:1;min-width:170px}.field input{background:#091c30;color:white;padding:12px;border:1px solid var(--line);border-radius:10px;max-width:100%}.namefields{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.playlayout{display:grid;grid-template-columns:minmax(310px,640px) minmax(230px,1fr);gap:18px;align-items:start}.boardpanel{padding:16px}.boardtitle{font-weight:800;font-size:20px;margin:0 0 12px}.boardwrap{width:100%;max-width:620px;margin:auto}.board{display:grid;grid-template-columns:30px repeat(10,minmax(0,1fr));gap:3px;user-select:none}.coord{display:grid;place-items:center;font-size:12px;color:#92b9d8;font-weight:700}.cell{aspect-ratio:1;background:var(--sea);border:1px solid #38749c;border-radius:6px;display:grid;place-items:center;color:#eaffff;font-weight:900;font-size:clamp(11px,1.7vw,22px);padding:0}.cell.interactive:hover{background:#357ba7;border-color:#b5e4ff}.cell.ship{background:#648097;border-color:#abc4cf}.cell.ship.hit{background:#9a3d4e}.cell.miss{background:#18314b;color:#86c5e9}.cell.hit{background:#9a3d4e;border-color:#f9a0a4;color:white}.cell.selected{outline:3px solid var(--gold);outline-offset:-3px;background:#41769a}.cell.disabled{cursor:default}.side h2{margin:0 0 10px}.side p{color:var(--muted);line-height:1.5}.stat{background:#0b2034;border:1px solid #294763;border-radius:10px;padding:12px;margin-top:9px}.stat strong{display:block;color:var(--ink);margin-bottom:3px}.mini{color:var(--muted);font-size:13px}.ships{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 16px}.shiptag{border:1px solid #426782;border-radius:10px;background:#143852;padding:10px 12px;color:var(--ink)}.shiptag.active{border-color:var(--gold);box-shadow:0 0 0 2px #ffd46e44}.shiptag.done{opacity:.5;text-decoration:line-through}.status{padding:13px;border-radius:10px;background:#0a1e32;border:1px solid #31516c;margin:13px 0;line-height:1.5}.success{border-color:#38bd98;color:#aaf3d9}.warn{border-color:#ee8888;color:#ffd4d4}.shots{display:grid;grid-template-columns:1fr 1fr;gap:9px}.shots .stat{margin:0}.equation{font-size:clamp(24px,3vw,36px);font-weight:900;margin:15px 0;color:var(--gold)}.answerrow{display:flex;gap:10px;align-items:center}.answerrow input{min-width:0;width:140px;background:#071b2b;border:1px solid #517491;border-radius:9px;padding:12px;color:white;font-size:22px;font-weight:700}.muted{color:var(--muted)}.footer{text-align:center;color:#7e9db8;margin:22px 0;font-size:12px}.kbd{background:#294963;border-radius:6px;padding:2px 6px;color:#fff}@media(max-width:790px){.playlayout{grid-template-columns:1fr}.shell{padding:12px}.panel{padding:15px}.board{grid-template-columns:24px repeat(10,minmax(0,1fr));gap:2px}.cell{border-radius:3px}.center{margin:3vh auto}}@media(prefers-reduced-motion:no-preference){.btn,.cell{transition:background .12s,transform .12s}.btn:not(:disabled):hover{transform:translateY(-1px)}}

/* Naches-inspired gold, white, black and ocean blue */
:root{--bg:#040c16;--panel:#091a30;--panel2:#102b49;--line:#8c7135;--sea:#103f67;--sea2:#25618a;--ink:#ffffff;--muted:#bed1e0;--gold:#f2c444;--mint:#94e9cf;--red:#ff6d66}
body{background:radial-gradient(ellipse at 50% -20%,#214974 0%,#0a1c33 48%,#03080e 100%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,transparent 0 85px,#ffffff05 86px 87px),radial-gradient(circle at 85% 25%,#e3ae2712,transparent 33%)}
.shell{position:relative}.top{border-bottom:2px solid #c79d37;padding-bottom:17px}.brand{color:#fff;text-shadow:0 2px 14px #000}.school{display:inline-block;font-size:11px;color:#071522;background:var(--gold);padding:5px 8px;border-radius:4px;vertical-align:middle;letter-spacing:.08em;margin-left:7px}
.panel{background:linear-gradient(150deg,#122b46ed,#071422f5);border-color:#89714070;box-shadow:0 20px 60px #0008,inset 0 1px #ffffff13}.chip{border-color:var(--gold);color:var(--gold);font-weight:800}.btn{box-shadow:0 3px 0 #a0791a,0 9px 22px #0005}.btn.secondary{background:#153657;color:white;border-color:#7b9ab7;box-shadow:0 3px 0 #091b2c}.btn.ghost{box-shadow:none}.cell{border-radius:4px;background:linear-gradient(145deg,#205681,#0d365b);border-color:#3c7094}.cell.ship{background:linear-gradient(130deg,#a8b7c2,#506679);border-color:#e5edee;box-shadow:inset 0 0 0 1px #ecf2f74d}.cell.hit{background:radial-gradient(circle,#ef886d,#923a3d);box-shadow:inset 0 0 10px #ffd09a99}.cell.miss{background:#081e36}.cell.interactive:hover{background:#2c719e;box-shadow:inset 0 0 0 2px var(--gold)}.coord{color:#ffe092}.board{grid-template-columns:clamp(18px,3vw,30px) repeat(var(--n),minmax(0,1fr))}.boardwrap{max-width:720px}.playlayout{grid-template-columns:minmax(0,720px) minmax(235px,1fr)}.boardpanel{min-width:0}.cell{font-size:clamp(9px,1.5vw,20px)}.settings{margin:20px 0;text-align:left}.settingslabel{font-weight:850;color:var(--gold);font-size:12px;letter-spacing:.08em;margin-bottom:9px}.sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:9px}.sizebtn{border:1px solid #54738c;background:#102b48;color:white;padding:11px 3px;border-radius:9px;font-weight:900;line-height:1.3}.sizebtn small{display:block;color:#b0c6d5;font-weight:500;font-size:10px}.sizebtn.chosen{background:#f2c444;color:#091725;border-color:#fff;box-shadow:0 0 0 2px #f2c44777}.sizebtn.chosen small{color:#3c3320}.difficulty-options{grid-template-columns:repeat(2,minmax(0,1fr))}.difficulty-options .sizebtn{min-height:69px}.difficulty-options .sizebtn small{font-size:11px}.bigicon{filter:drop-shadow(0 7px 14px #0009)}.flagship{animation:float 2.5s ease-in-out infinite}.resulticon{position:relative;z-index:1}.explosion{animation:boom .65s cubic-bezier(.1,.9,.2,1) both}.splash{animation:splash .9s ease-out both}.victory{animation:float 2s infinite}.burst{position:relative;height:0;margin-top:-17px}.burst i{position:absolute;left:50%;top:-85px;width:9px;height:9px;background:var(--gold);clip-path:polygon(50% 0,65% 35%,100% 50%,65% 65%,50% 100%,35% 65%,0 50%,35% 35%);animation:spark .9s ease-out forwards;transform:rotate(var(--a)) translateX(0);opacity:0}.burst i:nth-child(3n){background:white}.burst i:nth-child(4n){background:#71cafa}@keyframes boom{0%{transform:scale(.2) rotate(-25deg);opacity:0}55%{transform:scale(1.35) rotate(10deg);opacity:1}100%{transform:scale(1)}}@keyframes splash{0%{transform:translateY(35px) scale(.6);opacity:.2}60%{transform:translateY(-14px) scale(1.2)}100%{transform:translateY(0) scale(1)}}@keyframes spark{0%{transform:rotate(var(--a)) translateX(0) scale(.2);opacity:1}70%{opacity:1}100%{transform:rotate(var(--a)) translateX(var(--d)) scale(1.1);opacity:0}}@keyframes float{50%{transform:translateY(-7px)}}
@media(max-width:790px){.playlayout{grid-template-columns:1fr}.board{grid-template-columns:20px repeat(var(--n),minmax(0,1fr));gap:2px}.sizes{gap:5px}.sizebtn{font-size:12px}.cell{font-size:11px}.school{margin-top:5px}}@media(prefers-reduced-motion:reduce){.flagship,.explosion,.splash,.victory,.burst i{animation:none}}

/* Decorative ocean theater: illustrations stay outside the interactive playing surface. */
.ocean-art{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.number-cloud{position:absolute;top:8%;bottom:2%;width:17%;font-size:clamp(20px,3vw,42px);font-weight:900;letter-spacing:23px;line-height:2.35;overflow:hidden;overflow-wrap:anywhere;color:#91d0ff;opacity:.105;transform:rotate(-9deg);filter:blur(.4px)}
.number-cloud.left{left:0}.number-cloud.right{right:0;transform:rotate(10deg);color:#f2c444}
.side-vessel{position:absolute;width:clamp(150px,19vw,305px);height:410px;opacity:.16;filter:drop-shadow(0 10px 12px #000)}
.vessel-left{top:21%;left:-90px;transform:rotate(-24deg)}.vessel-right{bottom:1%;right:-85px;transform:rotate(25deg)}
.shell{z-index:1}.mode-info{border:1px solid #667f99;border-left:5px solid var(--gold);background:#07182c;border-radius:10px;padding:14px 15px;color:#cee3f3;line-height:1.5;min-height:91px;transition:border-color .2s,background .2s}.mode-info strong{display:block;color:var(--gold);margin-bottom:6px;font-size:14px;letter-spacing:.045em}.mode-info span{display:block;font-size:13px}.mode-training{border-left-color:#64d8b9}.mode-training strong{color:#8cf5d5}.mode-expert{border-left-color:#ff9c64}.mode-expert strong{color:#ffbd98}.mode-nightmare{border-left-color:#f47777;background:#281524}.mode-nightmare strong{color:#ff9999}
/* Distinct toy-fleet designs: color + pattern + profile + center marking. */
.cell.ship{position:relative;font-size:clamp(10px,1.5vw,19px);text-shadow:0 1px 3px #001a2a;box-shadow:inset 0 0 0 1px #ffffff4d,inset 0 -5px 8px #07152270}
.cell.ship-carrier{background:repeating-linear-gradient(90deg,#91bdd0 0 12px,#709bac 12px 16px);border-color:#dbf4ff;color:#17314c}
.cell.ship-battleship{background:repeating-linear-gradient(135deg,#f0c35e 0 8px,#cc9639 8px 13px);border-color:#ffe5a1;color:#172a3c}
.cell.ship-cruiser{background:linear-gradient(135deg,#87d5bd,#2c8f89);border-color:#b1ffdc;color:#0b343b}
.cell.ship-submarine{background:repeating-linear-gradient(115deg,#a3a0cb 0 12px,#6869a6 12px 17px);border-color:#c4c6ff;color:white}
.cell.ship-patrol{background:linear-gradient(145deg,#faad87,#c85b49);border-color:#ffdebe;color:#472b2b}
.cell.ship-h.ship-bow{border-radius:48% 5px 5px 48%}.cell.ship-h.ship-stern{border-radius:5px 28% 28% 5px}
.cell.ship-v.ship-bow{border-radius:48% 48% 5px 5px}.cell.ship-v.ship-stern{border-radius:5px 5px 28% 28%}
.cell.ship.hit{background:radial-gradient(circle,#ffbc70,#a93141 68%);color:white;border-color:#ffdfac;text-shadow:0 0 8px #fff}
.shiptag{font-weight:700}.ship-symbol{display:inline-grid;place-items:center;width:23px;height:23px;margin-right:7px;background:#ffffff20;border-radius:6px}
.shiptag-carrier{border-color:#98d6ee}.shiptag-battleship{border-color:#f3c454}.shiptag-cruiser{border-color:#62cda8}.shiptag-submarine{border-color:#a09be5}.shiptag-patrol{border-color:#ff9e79}
@media(max-width:1250px){.number-cloud{opacity:.065}.side-vessel{opacity:.09}}
@media(max-width:850px){.side-vessel{display:none}.number-cloud{width:12%;opacity:.05;letter-spacing:9px}.cell.ship{font-size:11px}}
@media(prefers-reduced-motion:reduce){.mode-info{transition:none}}
</style>
</head>
<body><div class="ocean-art" aria-hidden="true"><div class="number-cloud left">2 4 6 8 12 × 7 9 5 3 11 10 12 4 8 6 2 × 9 7 5</div><div class="number-cloud right">12 × 12 144 8 9 72 11 6 66 5 7 35 10 10 100</div><svg class="side-vessel vessel-left" viewBox="0 0 280 430" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M95 25L120 5L146 25L160 72V310L140 367L101 367L80 310V72Z" fill="#b0c8d6" stroke="#f2c444" stroke-width="5"/><path d="M104 73H141V310H104Z" fill="#315673"/><rect x="96" y="140" width="54" height="110" rx="12" fill="#e3b946"/><path d="M110 95H136V128H110Z" fill="#091d33"/><path d="M96 265H149M80 320H159" stroke="white" stroke-width="5"/><path d="M92 30L123 14L153 30" stroke="#fff" stroke-width="5"/></svg><svg class="side-vessel vessel-right" viewBox="0 0 280 430" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M105 45Q141 -5 174 45L174 355Q142 414 105 355Z" fill="#4b8da7" stroke="#e4c15b" stroke-width="5"/><path d="M116 98V310M162 98V310" stroke="#e0eef5" stroke-width="4"/><rect x="117" y="161" width="45" height="115" rx="21" fill="#12344f"/><rect x="128" y="134" width="24" height="52" rx="10" fill="#dfba55"/><path d="M141 134V85M141 85H173" stroke="white" stroke-width="6"/><circle cx="140" cy="222" r="9" fill="#d3effa"/></svg></div><div class="shell"><header class="top"><div><div class="sub">TWO PLAYERS · ONE COMPUTER</div><div class="brand">⚓ MULTIPLICATION BATTLESHIP <span class="school">NACHES EDITION</span></div></div><div class="chip" id="phaseChip">PASS & PLAY</div></header><main id="app"></main><footer class="footer">No accounts · No internet required · Nothing is saved when this page closes · Honor system: look away during handoffs</footer></div>
<script>
(()=>{'use strict';
const app=document.getElementById('app'),chip=document.getElementById('phaseChip');
let boardSize=12;
const fleet=[{name:'Carrier',size:5,kind:'carrier',icon:'▰'},{name:'Battleship',size:4,kind:'battleship',icon:'✦'},{name:'Cruiser',size:3,kind:'cruiser',icon:'◆'},{name:'Submarine',size:3,kind:'submarine',icon:'◉'},{name:'Patrol boat',size:2,kind:'patrol',icon:'➤'}];
let players=[],state='welcome',who=0,placement=0,vertical=false,selected=null,message='',nextStep='',lastShot=null,wrongAttempts=0,misfires=[0,0],difficulty="standard",firingShip=0;
function mathHint(x,y){return y>1?`Hint: ${x} × ${y} = ${x} × ${y-1} + ${x}.`:`Hint: any number multiplied by 1 stays the same.`;}
function person(name){return {name,ships:[],attacks:{},ready:false};}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setState(s){state=s;render()}
function boardCells(ship){return ship.cells}
function occupied(p){return new Set(p.ships.flatMap(boardCells))}
function coord(x,y){return y*boardSize+x}
function getShip(p,i){return p.ships.find(s=>s.cells.includes(i))}
function canPlace(p,x,y,size,v){let cells=[];for(let k=0;k<size;k++){let xx=x+(v?0:k),yy=y+(v?k:0);if(xx>=boardSize||yy>=boardSize||occupied(p).has(coord(xx,yy)))return null;cells.push(coord(xx,yy))}return cells}
function placeAt(x,y){const p=players[who];if(placement>=fleet.length)return;const cells=canPlace(p,x,y,fleet[placement].size,vertical);if(!cells){message='That ship does not fit or overlaps another ship. Try a different position.';render();return;}p.ships.push({...fleet[placement],cells});placement++;message='';render()}
function randomFleet(p){p.ships=[];for(const ship of fleet){let ok=null,tries=0,v=false;while(!ok&&tries++<300){v=Math.random()<.5;ok=canPlace(p,Math.floor(Math.random()*boardSize),Math.floor(Math.random()*boardSize),ship.size,v)}if(!ok){p.ships=[];return randomFleet(p)}p.ships.push({...ship,cells:ok})}placement=fleet.length;message='Random fleet placed. You can reset and arrange your own ships.';render()}
function shipSunk(p,s){return s.cells.every(i=>p.attacks[i]==='hit')}
function allSunk(p){return p.ships.every(s=>shipSunk(p,s))}
function afloatIndices(p){return p.ships.map((s,i)=>shipSunk(p,s)?-1:i).filter(i=>i>=0)}
function rowBoard(p,type){let html='<div class="board" style="--n:'+boardSize+'" role="grid" aria-label="'+(type==='place'?'Your ships':type==='attack'?'Opponent attack map':'Your fleet')+'"><div></div>';for(let x=1;x<=boardSize;x++)html+='<div class="coord">'+x+'</div>';for(let y=0;y<boardSize;y++){html+='<div class="coord">'+(y+1)+'</div>';for(let x=0;x<boardSize;x++){let i=coord(x,y),shot=type==='attack'?players[who].attacks[i]:type==='fleet'?players[1-who].attacks[i]:null,isShip=getShip(p,i),css='cell',txt='',action='';if(type!=='attack'&&isShip){const pos=isShip.cells.indexOf(i),v=isShip.cells.length>1&&(isShip.cells[1]-isShip.cells[0]===boardSize);css+=' ship ship-'+isShip.kind+' '+(v?'ship-v':'ship-h')+' '+(pos===0?'ship-bow':pos===isShip.cells.length-1?'ship-stern':'ship-mid');if(!shot)txt=pos===Math.floor(isShip.cells.length/2)?isShip.icon:'';}if(shot){css+=' '+shot;txt=shot==='hit'?'✕':'•';}if(type==='place'&&placement<fleet.length){css+=' interactive';action='data-place="'+x+','+y+'"'}if(type==='attack'&&!shot){css+=' interactive'+(selected===i?' selected':'');action='data-select="'+x+','+y+'"'}html+='<button type="button" class="'+css+'" '+action+' aria-label="Column '+(x+1)+', row '+(y+1)+(shot?', '+shot:'')+(type!=='attack'&&isShip?', '+isShip.name:'')+'">'+txt+'</button>';} }return html+'</div>';}
const modeRules={training:{title:'TRAINING · Learn as you play',detail:'Unlimited attempts. Every incorrect answer gives a hint, and you can keep trying until you get it right. No turn is lost.'},standard:{title:'STANDARD · One chance to recover',detail:'Your first incorrect answer gives a helpful hint and one retry. A second incorrect answer causes a misfire and ends your turn. The target remains hidden.'},expert:{title:'EXPERT · Every answer counts',detail:'One incorrect answer causes an immediate misfire and ends your turn. The shot never reaches the enemy, and its location remains available.'},nightmare:{title:'NIGHTMARE · Friendly-fire danger',detail:'Choose one of your surviving ships to fire. One incorrect answer instantly sinks your chosen ship and ends your turn. Lose your final ship and your opponent wins!'}};
function updateDifficultyDescription(){let el=document.getElementById('modeInfo');if(el){let r=modeRules[difficulty];el.innerHTML='<strong>'+r.title+'</strong><span>'+r.detail+'</span>';el.className='mode-info mode-'+difficulty;}}
function viewIntro(){chip.textContent='READY TO PLAY';app.innerHTML=`<section class="panel center"><div class="bigicon flagship">⚓</div><h1>Sink ships. Practice multiplication.</h1><p>Two students share one computer. Set up ships privately, then take turns calling coordinates and solving multiplication equations to launch attacks. <strong>Choose your difficulty: Training, Standard, Expert, or Nightmare.</strong></p><div class="settings"><div class="settingslabel">CHOOSE YOUR OCEAN SIZE</div><div class="sizes" role="group" aria-label="Board size"><button type="button" class="sizebtn" data-size="8">8 × 8<small>Easy</small></button><button type="button" class="sizebtn" data-size="10">10 × 10<small>Classic</small></button><button type="button" class="sizebtn chosen" data-size="12">12 × 12<small>Recommended</small></button><button type="button" class="sizebtn" data-size="15">15 × 15<small>Challenge</small></button></div><div class="mini">Rows and columns go from 1 up to your selected board size. For 12 × 12, students practice up to 12 × 12 = 144.</div></div><div class="settings"><div class="settingslabel">CHOOSE YOUR DIFFICULTY</div><div class="sizes difficulty-options" role="group" aria-label="Math difficulty"><button class="sizebtn" data-difficulty="training">Training<small>Keep retrying with hints</small></button><button class="sizebtn chosen" data-difficulty="standard">Standard<small>2 wrong = lost turn</small></button><button class="sizebtn" data-difficulty="expert">Expert<small>1 wrong = lost turn</small></button><button class="sizebtn" data-difficulty="nightmare">Nightmare<small>1 wrong = your firing ship sinks!</small></button></div><div class="mode-info" id="modeInfo" aria-live="polite"></div></div><div class="namefields"><label class="field">PLAYER 1 NAME<input id="name1" maxlength="24" value="Player 1"></label><label class="field">PLAYER 2 NAME<input id="name2" maxlength="24" value="Player 2"></label></div><div class="stat" style="text-align:left"><strong>Privacy rule</strong><span class="mini">The other player turns away during ship placement and each turn. A full-screen handoff pauses the game until the next player says they are ready.</span></div><div class="btnrow"><button class="btn" id="start">Start game →</button></div></section>`;app.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{boardSize=Number(b.dataset.size);app.querySelectorAll('[data-size]').forEach(v=>v.classList.toggle('chosen',v===b))});updateDifficultyDescription();app.querySelectorAll('[data-difficulty]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.difficulty;app.querySelectorAll('[data-difficulty]').forEach(v=>v.classList.toggle('chosen',v===b));updateDifficultyDescription()});document.getElementById('start').onclick=()=>{players=[person(document.getElementById('name1').value.trim()||'Player 1'),person(document.getElementById('name2').value.trim()||'Player 2')];who=0;placement=0;vertical=false;wrongAttempts=0;misfires=[0,0];firingShip=0;setState('handoffSetup')};}
function handoff(){chip.textContent='PRIVACY SCREEN';let p=players[who],setup=state==='handoffSetup';app.innerHTML=`<section class="panel center"><div class="bigicon">🔒</div><div class="sub">SCREEN COVERED · PASS THE COMPUTER</div><h1>${esc(p.name)}, you're up!</h1><p>${setup?'Your opponent should look away while you position your ships.':'Your opponent should look away before you reveal your private fleet and firing board.'}</p><div class="status"><strong>Honor system:</strong> hand the computer to ${esc(p.name)}. Only ${esc(p.name)} should press the button below.</div><div class="btnrow"><button class="btn" id="reveal">${setup?'I’m ready to place my ships':'I’m ready for my turn'} →</button></div></section>`;document.getElementById('reveal').onclick=()=>setState(setup?'setup':'turn');}
function viewSetup(){let p=players[who];chip.textContent='SHIP PLACEMENT';app.innerHTML=`<div class="playlayout"><section class="panel boardpanel"><h2 class="boardtitle">${esc(p.name)}'s secret fleet</h2><div class="boardwrap">${rowBoard(p,'place')}</div></section><aside class="panel side"><div class="sub">PRIVATE SETUP</div><h2>Position your ships</h2><div class="mini">${boardSize} × ${boardSize}</div><p>Click a starting square to place each ship. Ships cannot overlap or extend outside the board.</p><div class="ships">${fleet.map((s,i)=>`<div class="shiptag shiptag-${s.kind} ${i<placement?'done':i===placement?'active':''}"><span class="ship-symbol">${s.icon}</span>${esc(s.name)} · ${s.size}</div>`).join('')}</div><div class="status">${placement===fleet.length?'All five ships are ready.':'Next: '+fleet[placement].name+' ('+fleet[placement].size+' squares)'}</div><div class="btnrow" style="justify-content:flex-start"><button class="btn secondary" id="rotate">↻ ${vertical?'Vertical':'Horizontal'}</button><button class="btn secondary" id="random">Random ships</button><button class="btn ghost" id="reset">Reset board</button></div>${message?`<p class="muted" role="status">${esc(message)}</p>`:''}<div class="btnrow" style="justify-content:flex-start"><button class="btn" id="confirm" ${placement<fleet.length?'disabled':''}>Lock in my ships →</button></div></aside></div>`;app.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{const [x,y]=b.dataset.place.split(',').map(Number);placeAt(x,y)});document.getElementById('rotate').onclick=()=>{vertical=!vertical;render()};document.getElementById('random').onclick=()=>randomFleet(p);document.getElementById('reset').onclick=()=>{p.ships=[];placement=0;message='';render()};document.getElementById('confirm').onclick=()=>{p.ready=true;message='';if(who===0){who=1;placement=0;vertical=false;setState('handoffSetup')}else{who=0;firingShip=0;setState('handoffTurn')}};}
function viewTurn(){let p=players[who],op=players[1-who],shots=Object.values(p.attacks),hits=shots.filter(s=>s==='hit').length,misses=shots.filter(s=>s==='miss').length;chip.textContent=p.name.toUpperCase()+'’S TURN';if(difficulty==='nightmare'&&!afloatIndices(p).includes(firingShip))firingShip=afloatIndices(p)[0];app.innerHTML=`<div class="playlayout"><section class="panel boardpanel"><h2 class="boardtitle">Target grid · ${esc(op.name)}'s waters (${boardSize} × ${boardSize})</h2><div class="boardwrap">${rowBoard(p,'attack')}</div><div class="mini" style="margin-top:12px">Select an untried square. Across is the first number; down is the second.</div><details style="margin-top:16px"><summary style="cursor:pointer;font-weight:700;color:var(--gold)">Show my own fleet and damage</summary><div class="boardwrap" style="margin-top:12px">${rowBoard(p,'fleet')}</div></details></section><aside class="panel side"><div class="sub">CURRENT CAPTAIN</div><h2>${esc(p.name)}</h2><div class="shots"><div class="stat"><strong>${hits}</strong><span class="mini">Successful hits</span></div><div class="stat"><strong>${misses}</strong><span class="mini">Misses</span></div></div><div class="stat"><strong>Fleet status</strong><span class="mini">Your ships left afloat: ${p.ships.filter(s=>!s.cells.every(i=>op.attacks[i]==='hit')).length} / 5</span></div><p>Choose where to bomb, then calculate the multiplication answer to fire.</p>${difficulty==='nightmare'?`<div class="stat"><strong>YOUR FIRING SHIP</strong><p class="mini">A wrong answer instantly sinks the selected ship. Select a ship before firing.</p><select id="firingShip" aria-label="Choose firing ship" style="width:100%;padding:12px;background:#091c30;color:white;border:1px solid #ffd46e;border-radius:9px">${p.ships.map((s,i)=>`<option value="${i}" ${shipSunk(p,s)?'disabled':''} ${i===firingShip?'selected':''}>${s.icon} ${esc(s.name)} (${s.size})${shipSunk(p,s)?' — SUNK':''}</option>`).join('')}</select></div>`:''}${selected===null?'<div class="status">Select a square to prepare an attack.</div>':`<div class="status">Target: <strong>${selected%boardSize+1} across × ${Math.floor(selected/boardSize)+1} down</strong></div><div class="equation">${selected%boardSize+1} × ${Math.floor(selected/boardSize)+1} = ?</div><form id="fireForm"><label class="field" style="margin-bottom:10px">YOUR ANSWER<div class="answerrow"><input id="answer" type="number" min="0" max="225" inputmode="numeric" required autocomplete="off"><button class="btn" type="submit">Fire! ⚡</button></div></label></form>`}${message?`<div class="status warn" role="status">${esc(message)}</div>`:''}${wrongAttempts>0?'<div class="mini">Target locked for retry. '+(difficulty==='training'?'Keep practicing.':'One more mistake ends your turn.')+'</div>':''}<div class="stat"><strong>Misfires: ${misfires[who]}</strong><span class="mini">${difficulty==='training'?'Keep trying; hints are provided.':difficulty==='standard'?'Two incorrect answers cost a turn.':difficulty==='expert'?'One incorrect answer costs a turn.':'One incorrect answer sinks your firing ship.'}</span></div><div class="stat"><strong>Shot markers</strong><span class="mini">✕ = hit &nbsp;&nbsp; • = miss &nbsp;&nbsp; dark square = not yet fired</span></div></aside></div>`;const firingSelect=document.getElementById('firingShip');if(firingSelect)firingSelect.onchange=()=>{firingShip=Number(firingSelect.value)};app.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{const [x,y]=b.dataset.select.split(',').map(Number);if(wrongAttempts>0)return;selected=coord(x,y);wrongAttempts=0;message='';render();document.getElementById('answer')?.focus()});let form=document.getElementById('fireForm');if(form)form.onsubmit=e=>{e.preventDefault();const a=Number(document.getElementById('answer').value),x=selected%boardSize+1,y=Math.floor(selected/boardSize)+1,correct=x*y;if(a!==correct){wrongAttempts++;if(difficulty==='training'||(difficulty==='standard'&&wrongAttempts===1)){message=(difficulty==='training'?'TARGETING ERROR — Try again! ':'TARGETING ERROR — One retry! ')+mathHint(x,y);render();document.getElementById('answer')?.focus();return}misfires[who]++;lastShot={target:selected,correct,misfire:true,nightmare:difficulty==='nightmare',ship:null,opponentWins:false};if(difficulty==='nightmare'){const ship=p.ships[firingShip];if(!ship||shipSunk(p,ship)){message='Choose a ship still afloat.';wrongAttempts=0;render();return}ship.cells.forEach(i=>{op.attacks[i]='hit'});lastShot.ship=ship.name;lastShot.opponentWins=allSunk(p)}wrongAttempts=0;selected=null;message='';setState('misfire');return}const hit=!!getShip(op,selected);p.attacks[selected]=hit?'hit':'miss';lastShot={target:selected,hit,sunk:hit?getShip(op,selected).cells.every(i=>p.attacks[i]==='hit'):false,ship:hit?getShip(op,selected).name:null};selected=null;wrongAttempts=0;message='';setState('result')};}
function viewMisfire(){const p=players[who],x=lastShot.target%boardSize+1,y=Math.floor(lastShot.target/boardSize)+1,nightmare=lastShot.nightmare,loss=lastShot.opponentWins;chip.textContent=loss?'GAME OVER':'TARGETING FAILURE';app.innerHTML=`<section class="panel center"><div class="bigicon resulticon explosion">${nightmare?'💥':'⚠️'}</div><div class="sub">${nightmare?'NIGHTMARE · INCORRECT ANSWER':difficulty==='expert'?'INCORRECT ANSWER':'TWO INCORRECT ANSWERS'}</div><h1 style="color:var(--gold)">${loss?esc(players[1-who].name)+' wins!':nightmare?'FRIENDLY FIRE! '+esc(lastShot.ship)+' SUNK!':'MISFIRE! TURN LOST'}</h1><p>That target was ${x} × ${y} = <strong style="color:var(--gold)">${x*y}</strong>.</p><div class="status">${nightmare?`Your ${esc(lastShot.ship)} was lost to a misfire. The enemy target was not revealed. ${loss?'Your entire fleet has been sunk.':'Your turn is over.'}`:'Your shot was canceled, and the target remains available next turn.'} ${esc(mathHint(x,y))}</div><div class="btnrow"><button class="btn" id="next">${loss?'Play another game':'End turn · Cover the screen →'}</button></div></section>`;document.getElementById('next').onclick=()=>{if(loss){resetGame();return}who=1-who;selected=null;wrongAttempts=0;setState('handoffTurn')};}
function viewResult(){const p=players[who],win=allSunk(players[1-who]),x=lastShot.target%boardSize+1,y=Math.floor(lastShot.target/boardSize)+1;chip.textContent=win?'GAME OVER':'SHOT RESULT';app.innerHTML=`<section class="panel center"><div class="bigicon resulticon ${win?'victory':lastShot.hit?'explosion':'splash'}">${win?'🏆':lastShot.hit?'💥':'🌊'}</div><div class="sub">${esc(p.name)} fired at ${x} × ${y} = ${x*y}</div><div class="burst" aria-hidden="true">${Array.from({length:16},(_,i)=>`<i style="--a:${i*22.5}deg;--d:${65+i%4*14}px"></i>`).join('')}</div><h1>${win?esc(p.name)+' wins!':lastShot.sunk?'Ship sunk!':lastShot.hit?'Direct hit!':'Miss!'}</h1><p>${win?'You sunk every enemy ship.':lastShot.sunk?'You sank the '+esc(lastShot.ship)+'.':lastShot.hit?'You hit an enemy ship.':'No ship at that location.'}</p><div class="btnrow">${win?'<button class="btn" id="again">Play another game</button>': '<button class="btn" id="next">End turn · Cover the screen →</button>'}</div></section>`;if(win)document.getElementById('again').onclick=resetGame;else document.getElementById('next').onclick=()=>{who=1-who;selected=null;setState('handoffTurn')};}
function resetGame(){players=[];who=0;placement=0;selected=null;wrongAttempts=0;misfires=[0,0];firingShip=0;message='';setState('welcome')}
function render(){if(state==='welcome')viewIntro();else if(state==='handoffSetup'||state==='handoffTurn')handoff();else if(state==='setup')viewSetup();else if(state==='turn')viewTurn();else if(state==='result')viewResult();else if(state==='misfire')viewMisfire();}
render();
})();
</script></body></html>
