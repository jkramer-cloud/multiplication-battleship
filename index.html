epeat(10,minmax(0,1fr));gap:3px;user-select:none}.coord{display:grid;place-items:center;font-size:12px;color:#92b9d8;font-weight:700}.cell{aspect-ratio:1;background:var(--sea);border:1px solid #38749c;border-radius:6px;display:grid;place-items:center;color:#eaffff;font-weight:900;font-size:clamp(11px,1.7vw,22px);padding:0}.cell.interactive:hover{background:#357ba7;border-color:#b5e4ff}.cell.ship{background:#648097;border-color:#abc4cf}.cell.ship.hit{background:#9a3d4e}.cell.miss{background:#18314b;color:#86c5e9}.cell.hit{background:#9a3d4e;border-color:#f9a0a4;color:white}.cell.selected{outline:3px solid var(--gold);outline-offset:-3px;background:#41769a}.cell.disabled{cursor:default}.side h2{margin:0 0 10px}.side p{color:var(--muted);line-height:1.5}.stat{background:#0b2034;border:1px solid #294763;border-radius:10px;padding:12px;margin-top:9px}.stat strong{display:block;color:var(--ink);margin-bottom:3px}.mini{color:var(--muted);font-size:13px}.ships{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 16px}.shiptag{border:1px solid #426782;border-radius:10px;background:#143852;padding:10px 12px;color:var(--ink)}.shiptag.active{border-color:var(--gold);box-shadow:0 0 0 2px #ffd46e44}.shiptag.done{opacity:.5;text-decoration:line-through}.status{padding:13px;border-radius:10px;background:#0a1e32;border:1px solid #31516c;margin:13px 0;line-height:1.5}.success{border-color:#38bd98;color:#aaf3d9}.warn{border-color:#ee8888;color:#ffd4d4}.shots{display:grid;grid-template-columns:1fr 1fr;gap:9px}.shots .stat{margin:0}.equation{font-size:clamp(24px,3vw,36px);font-weight:900;margin:15px 0;color:var(--gold)}.answerrow{display:flex;gap:10px;align-items:center}.answerrow input{min-width:0;width:140px;background:#071b2b;border:1px solid #517491;border-radius:9px;padding:12px;color:white;font-size:22px;font-weight:700}.muted{color:var(--muted)}.footer{text-align:center;color:#7e9db8;margin:22px 0;font-size:12px}.kbd{background:#294963;border-radius:6px;padding:2px 6px;color:#fff}@media(max-width:790px){.playlayout{grid-template-columns:1fr}.shell{padding:12px}.panel{padding:15px}.board{grid-template-columns:24px repeat(10,minmax(0,1fr));gap:2px}.cell{border-radius:3px}.center{margin:3vh auto}}@media(prefers-reduced-motion:no-preference){.btn,.cell{transition:background .12s,transform .12s}.btn:not(:disabled):hover{transform:translateY(-1px)}}

/* Naches-inspired gold, white, black and ocean blue */
:root{--bg:#040c16;--panel:#091a30;--panel2:#102b49;--line:#8c7135;--sea:#103f67;--sea2:#25618a;--ink:#ffffff;--muted:#bed1e0;--gold:#f2c444;--mint:#94e9cf;--red:#ff6d66}

.shell{position:relative}.top{border-bottom:2px solid #c79d37;padding-bottom:17px}.brand{color:#fff;text-shadow:0 2px 14px #000}.school{display:inline-block;font-size:11px;color:#071522;background:var(--gold);padding:5px 8px;border-radius:4px;vertical-align:middle;letter-spacing:.08em;margin-left:7px}
.panel{background:linear-gradient(150deg,#122b46ed,#071422f5);border-color:#89714070;box-shadow:0 20px 60px #0008,inset 0 1px #ffffff13}.chip{border-color:var(--gold);color:var(--gold);font-weight:800}.btn{box-shadow:0 3px 0 #a0791a,0 9px 22px #0005}.btn.secondary{background:#153657;color:white;border-color:#7b9ab7;box-shadow:0 3px 0 #091b2c}.btn.ghost{box-shadow:none}.cell{border-radius:4px;background:linear-gradient(145deg,#205681,#0d365b);border-color:#3c7094}.cell.ship{background:linear-gradient(130deg,#a8b7c2,#506679);border-color:#e5edee;box-shadow:inset 0 0 0 1px #ecf2f74d}.cell.hit{background:radial-gradient(circle,#ef886d,#923a3d);box-shadow:inset 0 0 10px #ffd09a99}.cell.miss{background:#081e36}.cell.interactive:hover{background:#2c719e;box-shadow:inset 0 0 0 2px var(--gold)}.coord{color:#ffe092}.board{grid-template-columns:clamp(18px,3vw,30px) repeat(var(--n),minmax(0,1fr))}.boardwrap{max-width:720px}.playlayout{grid-template-columns:minmax(0,720px) minmax(235px,1fr)}.boardpanel{min-width:0}.cell{font-size:clamp(9px,1.5vw,20px)}.settings{margin:20px 0;text-align:left}.settingslabel{font-weight:850;color:var(--gold);font-size:12px;letter-spacing:.08em;margin-bottom:9px}.sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:9px}.sizebtn{border:1px solid #54738c;background:#102b48;color:white;padding:11px 3px;border-radius:9px;font-weight:900;line-height:1.3}.sizebtn small{display:block;color:#b0c6d5;font-weight:500;font-size:10px}.sizebtn.chosen{background:#f2c444;color:#091725;border-color:#fff;box-shadow:0 0 0 2px #f2c44777}.sizebtn.chosen small{color:#3c3320}.difficulty-options{grid-template-columns:repeat(2,minmax(0,1fr))}.difficulty-options .sizebtn{min-height:69px}.difficulty-options .sizebtn small{font-size:11px}.bigicon{filter:drop-shadow(0 7px 14px #0009)}.flagship{animation:float 2.5s ease-in-out infinite}.resulticon{position:relative;z-index:1}.explosion{animation:boom .65s cubic-bezier(.1,.9,.2,1) both}.splash{animation:splash .9s ease-out both}.victory{animation:float 2s infinite}.burst{position:relative;height:0;margin-top:-17px}.burst i{position:absolute;left:50%;top:-85px;width:9px;height:9px;background:var(--gold);clip-path:polygon(50% 0,65% 35%,100% 50%,65% 65%,50% 100%,35% 65%,0 50%,35% 35%);animation:spark .9s ease-out forwards;transform:rotate(var(--a)) translateX(0);opacity:0}.burst i:nth-child(3n){background:white}.burst i:nth-child(4n){background:#71cafa}@keyframes boom{0%{transform:scale(.2) rotate(-25deg);opacity:0}55%{transform:scale(1.35) rotate(10deg);opacity:1}100%{transform:scale(1)}}@keyframes splash{0%{transform:translateY(35px) scale(.6);opacity:.2}60%{transform:translateY(-14px) scale(1.2)}100%{transform:translateY(0) scale(1)}}@keyframes spark{0%{transform:rotate(var(--a)) translateX(0) scale(.2);opacity:1}70%{opacity:1}100%{transform:rotate(var(--a)) translateX(var(--d)) scale(1.1);opacity:0}}@keyframes float{50%{transform:translateY(-7px)}}
@media(max-width:790px){.playlayout{grid-template-columns:1fr}.board{grid-template-columns:20px repeat(var(--n),minmax(0,1fr));gap:2px}.sizes{gap:5px}.sizebtn{font-size:12px}.cell{font-size:11px}.school{margin-top:5px}}@media(prefers-reduced-motion:reduce){.flagship,.explosion,.splash,.victory,.burst i{animation:none}}

.shell{z-index:1}.mode-info{border:1px solid #667f99;border-left:5px solid var(--gold);background:#07182c;border-radius:10px;padding:14px 15px;color:#cee3f3;line-height:1.5;min-height:91px;transition:border-color .2s,background .2s}.mode-info strong{display:block;color:var(--gold);margin-bottom:6px;font-size:14px;letter-spacing:.045em}.mode-info span{display:block;font-size:13px}.mode-training{border-left-color:#64d8b9}.mode-training strong{color:#8cf5d5}.mode-expert{border-left-color:#ff9c64}.mode-expert strong{color:#ffbd98}.mode-nightmare{border-left-color:#f47777;background:#281524}.mode-nightmare strong{color:#ff9999}

@media(max-width:1250px){.number-cloud{opacity:.065}.side-vessel{opacity:.09}}

.game-select{width:100%;background:#071c31;color:white;padding:11px;border:1px solid #b99a46;border-radius:9px;font:inherit;margin-top:4px}
.game-select:disabled{opacity:.6}
.timer-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;color:#fff;font-weight:750;background:#102942;border:1px solid #7a97b1;border-radius:10px;padding:12px}

.timer-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#ffe49d;margin-bottom:9px}

<body><div class="ocean-art" aria-hidden="true"><div class="number-cloud left">2 4 6 8 12 × 7 9 5 3 11 10 12 4 8 6 2 × 9 7 5</div><div class="number-cloud right">12 × 12 144 8 9 72 11 6 66 5 7 35 10 10 100</div><svg class="side-vessel vessel-left" viewBox="0 0 280 430" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M95 25L120 5L146 25L160 72V310L140 367L101 367L80 310V72Z" fill="#b0c8d6" stroke="#f2c444" stroke-width="5"/><path d="M104 73H141V310H104Z" fill="#315673"/><rect x="96" y="140" width="54" height="110" rx="12" fill="#e3b946"/><path d="M110 95H136V128H110Z" fill="#091d33"/><path d="M96 265H149M80 320H159" stroke="white" stroke-width="5"/><path d="M92 30L123 14L153 30" stroke="#fff" stroke-width="5"/></svg><svg class="side-vessel vessel-right" viewBox="0 0 280 430" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M105 45Q141 -5 174 45L174 355Q142 414 105 355Z" fill="#4b8da7" stroke="#e4c15b" stroke-width="5"/><path d="M116 98V310M162 98V310" stroke="#e0eef5" stroke-width="4"/><rect x="117" y="161" width="45" height="115" rx="21" fill="#12344f"/><rect x="128" y="134" width="24" height="52" rx="10" fill="#dfba55"/><path d="M141 134V85M141 85H173" stroke="white" stroke-width="6"/><circle cx="140" cy="222" r="9" fill="#d3effa"/></svg></div><div class="shell"><header class="top"><div><div class="sub">SOLO OR TWO PLAYERS · ONE COMPUTER</div><div class="brand">⚓ MULTIPLICATION BATTLESHIP <span class="school">NACHES EDITION</span></div></div><div class="top-actions"><div class="chip" id="phaseChip">PASS & PLAY</div><button type="button" class="btn secondary endgame" id="endGame" hidden>End game</button></div></header><main id="app"></main><footer class="footer">No accounts · No internet required · Nothing is saved when this page closes · Private handoffs in two-player mode</footer></div>
<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const chip = document.getElementById('phaseChip');
  const sizeLabels = {8:'Easy',10:'Classic',12:'Recommended',15:'Challenge'};
  const captainNames = {rookie:'Rookie Captain',normal:'Experienced Sailor',hard:'Fleet Commander',nightmare:'Admiral Nightmare'};
  const accuracy = {rookie:0.75,normal:0.85,hard:0.95,nightmare:0.99};
  const timeLimits = {training:15,standard:12,expert:9,nightmare:6};
  const fleet = [
    {name:'Carrier',size:5,kind:'carrier',icon:'▰'},
    {name:'Battleship',size:4,kind:'battleship',icon:'✦'},
    {name:'Cruiser',size:3,kind:'cruiser',icon:'◆'},
    {name:'Submarine',size:3,kind:'submarine',icon:'◉'},
    {name:'Patrol boat',size:2,kind:'patrol',icon:'➤'}
  ];
  const modeRules={
    training:{title:'TRAINING · Learn as you play',detail:'Unlimited wrong-answer retries with hints. If Timed Fire is enabled, the clock can still cause a misfire.'},
    standard:{title:'STANDARD · One chance to recover',detail:'One wrong answer gives a hint and a retry. A second wrong answer, or a timer timeout, costs a turn.'},
    expert:{title:'EXPERT · Every answer counts',detail:'One wrong answer or a timer timeout cancels the attack and ends your turn.'},
    nightmare:{title:'NIGHTMARE · Friendly-fire danger',detail:'Choose the ship firing your shot. One wrong answer or a timeout sinks that ship. Losing your last ship ends the game.'}
  };
  let boardSize=12, difficulty='standard', gameMode='human', aiLevel='normal', timed=false, timeMultiplier=1;
  let players=[], who=0, state='welcome', placement=0, vertical=false, selected=null;
  let message='', wrongAttempts=0, misfires=[0,0], firingShip=0, lastShot=null;
  let timerHandle=null, shotDeadline=null, aiHandle=null, aiSunkCells=new Set();

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function person(name,computer=false){return {name,computer,ships:[],attacks:{},ready:false};}
  function coord(x,y){return y*boardSize+x;}
  function getShip(p,i){return p.ships.find(s=>s.cells.includes(i));}
  function occupied(p){return new Set(p.ships.flatMap(s=>s.cells));}
  function canPlace(p,x,y,size,v){
    const taken=occupied(p), cells=[];
    for(let k=0;k<size;k++){
      const xx=x+(v?0:k),yy=y+(v?k:0);
      if(xx>=boardSize||yy>=boardSize||taken.has(coord(xx,yy)))return null;
      cells.push(coord(xx,yy));
    }
    return cells;
  }
  function fillRandomFleet(p){
    for(let attempt=0;attempt<500;attempt++){
      p.ships=[];let good=true;
      for(const ship of fleet){
        let cells=null;
        for(let tries=0;tries<400&&!cells;tries++){
          cells=canPlace(p,Math.floor(Math.random()*boardSize),Math.floor(Math.random()*boardSize),ship.size,Math.random()<.5);
        }
        if(!cells){good=false;break;}
        p.ships.push({...ship,cells});
      }
      if(good)return;
    }
    throw new Error('Unable to generate a fleet');
  }
  function randomFleet(p){fillRandomFleet(p);placement=fleet.length;message='Random fleet placed. You can reset and arrange your own ships.';render();}
  function placeAt(x,y){
    const p=players[who];if(placement>=fleet.length)return;
    const cells=canPlace(p,x,y,fleet[placement].size,vertical);
    if(!cells){message='That ship does not fit or overlaps another ship. Try another square.';render();return;}
    p.ships.push({...fleet[placement],cells});placement++;message='';render();
  }
  function shipSunk(p,s){
    const defender=players.indexOf(p);
    return defender>=0&&players[1-defender]&&s.cells.every(i=>players[1-defender].attacks[i]==='hit');
  }
  function allSunk(p){return p.ships.length>0&&p.ships.every(s=>shipSunk(p,s));}
  function afloatIndices(p){return p.ships.map((s,i)=>shipSunk(p,s)?-1:i).filter(i=>i>=0);}
  function mathHint(x,y){return y>1?`Hint: ${x} × ${y} = ${x} × ${y-1} + ${x}.`:'Hint: any number multiplied by 1 stays the same.';}
  function clearClock(){if(timerHandle!==null){clearInterval(timerHandle);timerHandle=null;}shotDeadline=null;}
  function cancelBackgroundWork(){clearClock();if(aiHandle!==null){clearTimeout(aiHandle);aiHandle=null;}}
  function switchState(s){
    if(s!=='turn')clearClock();
    if(s!=='aiThinking'&&aiHandle!==null){clearTimeout(aiHandle);aiHandle=null;}
    state=s;render();
  }
  function board(p,type){
    let out=`<div class="board" style="--n:${boardSize}" role="grid" aria-label="${type==='place'?'Your ships':type==='attack'?'Opponent attack map':'Your fleet'}"><div></div>`;
    for(let x=1;x<=boardSize;x++)out+=`<div class="coord">${x}</div>`;
    for(let y=0;y<boardSize;y++){
      out+=`<div class="coord">${y+1}</div>`;
      for(let x=0;x<boardSize;x++){
        const i=coord(x,y),s=getShip(p,i);
        const shot=type==='attack'?players[who].attacks[i]:type==='fleet'?players[1-who].attacks[i]:null;
        let css='cell', txt='', action='';
        if(type!=='attack'&&s){
          const pos=s.cells.indexOf(i),v=s.cells.length>1&&(s.cells[1]-s.cells[0]===boardSize);
          css+=` ship ship-${s.kind} ${v?'ship-v':'ship-h'} ${pos===0?'ship-bow':pos===s.cells.length-1?'ship-stern':'ship-mid'}`;
          if(!shot)txt=pos===Math.floor(s.cells.length/2)?s.icon:'';
        }
        if(shot){css+=' '+shot;txt=shot==='hit'?'✕':'•';}
        if(type==='place'&&placement<fleet.length){css+=' interactive';action=`data-place="${x},${y}"`;}
        if(type==='attack'&&!shot){css+=' interactive'+(selected===i?' selected':'');action=`data-select="${x},${y}"`;}
        out+=`<button type="button" class="${css}" ${action} aria-label="Column ${x+1}, row ${y+1}${shot?', '+shot:''}${type!=='attack'&&s?', '+s.name:''}">${txt}</button>`;
      }

  function indexNeighbors(i){
    const x=i%boardSize,y=Math.floor(i/boardSize),out=[];
    if(x>0)out.push(i-1);if(x<boardSize-1)out.push(i+1);
    if(y>0)out.push(i-boardSize);if(y<boardSize-1)out.push(i+boardSize);
    return out;
  }
  function chooseAiTarget(){
    const ai=players[1],attacks=ai.attacks;
    const free=Array.from({length:boardSize*boardSize},(_,i)=>i).filter(i=>attacks[i]===undefined);
    if(!free.length)return null;
    const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
    const liveHits=Object.keys(attacks).map(Number).filter(i=>attacks[i]==='hit'&&!aiSunkCells.has(i));
    const targetSet=new Set();
    for(const i of liveHits){
      for(const n of indexNeighbors(i))if(attacks[n]===undefined)targetSet.add(n);
    }
    // For consecutive hits, continue along their horizontal/vertical direction.
    const lines=[];
    for(const i of liveHits){
      if(liveHits.includes(i+1)&&Math.floor((i+1)/boardSize)===Math.floor(i/boardSize)){
        if(i%boardSize>0&&attacks[i-1]===undefined)lines.push(i-1);
        if((i+2)%boardSize!==0&&attacks[i+2]===undefined)lines.push(i+2);
      }
      if(liveHits.includes(i+boardSize)){
        if(i>=boardSize&&attacks[i-boardSize]===undefined)lines.push(i-boardSize);
        if(i+boardSize*2<boardSize*boardSize&&attacks[i+boardSize*2]===undefined)lines.push(i+boardSize*2);
      }
    }
    if(aiLevel==='rookie'){
      if(targetSet.size&&Math.random()<0.22)return pick([...targetSet]);
      return pick(free);
    }
    if(targetSet.size&&(aiLevel!=='normal'||Math.random()<0.72)){
      const options=lines.filter(i=>attacks[i]===undefined);
      return options.length?pick(options):pick([...targetSet]);
    }
    if(aiLevel==='normal')return pick(free);
    const checker=free.filter(i=>(Math.floor(i/boardSize)+i%boardSize)%2===0);
    if(aiLevel==='hard')return pick(checker.length?checker:free);
    // Nightmare: rank unknown squares by the number of legal remaining-ship placements covering them.
    const score=new Map(free.map(i=>[i,0]));
    const sunkNames=players[0].ships.filter(s=>shipSunk(players[0],s)).map(s=>s.name);
    const remaining=fleet.filter(s=>!sunkNames.includes(s.name));
    for(const s of remaining){
      for(let y=0;y<boardSize;y++)for(let x=0;x<boardSize;x++)for(const v of [false,true]){
        const cells=[];
        for(let k=0;k<s.size;k++){
          const xx=x+(v?0:k), yy=y+(v?k:0);
          if(xx>=boardSize||yy>=boardSize)break;
          cells.push(coord(xx,yy));
        }
        if(cells.length!==s.size||cells.some(i=>attacks[i]==='miss'||aiSunkCells.has(i)))continue;
        // Prefer plausible placements containing known unsunk hits.
        const bonus=liveHits.length?1+2*cells.filter(i=>liveHits.includes(i)).length:1;
        for(const i of cells)if(score.has(i))score.set(i,score.get(i)+bonus);
      }
    }
    let top=-1,choices=[];
    for(const [i,n] of score){if(n>top){top=n;choices=[i];}else if(n===top)choices.push(i);}
    return pick(choices.length?choices:free);
  }

    const ai=players[1],loseHuman=lastShot.misfire&&lastShot.opponentWins;
    const win=lastShot.win&&!lastShot.misfire;
    const x=lastShot.target%boardSize+1,y=Math.floor(lastShot.target/boardSize)+1;
    chip.textContent=win||loseHuman?'GAME OVER':'COMPUTER RESULT';
    const mis=!!lastShot.misfire;
    const mainTitle=loseHuman?'You win! The computer sank its final ship.':mis?(lastShot.nightmare?`${esc(ai.name)} sank its own ${esc(lastShot.ship)}!`:'Computer misfire!'):
      win?`${esc(ai.name)} wins!`:lastShot.sunk?`Computer sank your ${esc(lastShot.ship)}!`:lastShot.hit?'Computer hit your ship!':'Computer missed!';
    app.innerHTML=`<section class="panel center"><div class="bigicon resulticon ${mis||lastShot.hit?'explosion':'splash'}">${win?'🏆':mis?'⚠️':lastShot.hit?'💥':'🌊'}</div>
      <div class="sub">${esc(ai.name)} · ${captainNames[aiLevel]} turn</div><h1>${mainTitle}</h1>
      <p>${mis?'The computer made a math mistake, so its attack never reached your fleet.':`It attacked column ${x}, row ${y} (${x} × ${y} = ${x*y}).`}</p>
      <div class="status">${loseHuman?'Your opponent sank its last ship. You win!':win?'All of your ships have been sunk.':mis?lastShot.nightmare?'The computer lost a ship to friendly fire.':'Its shot was canceled.':lastShot.sunk?'One of your ships has been destroyed.':lastShot.hit?'Your fleet took a hit.':'Your fleet is safe this round.'}</div>
      <div class="btnrow"><button class="btn" id="next">${win||loseHuman?'Play another game':'My turn →'}</button></div></section>`;
    // A computer's last-ship misfire is a victory for the student, not for the computer.
    document.getElementById('next').onclick=()=>{if(win||loseHuman){resetGame();return;}who=0;selected=null;firingShip=afloatIndices(players[0])[0]??0;switchState('turn');};
  }
  function resetGame(){cancelBackgroundWork();players=[];who=0;placement=0;vertical=false;selected=null;wrongAttempts=0;misfires=[0,0];firingShip=0;lastShot=null;message='';aiSunkCells=new Set();switchState('welcome');}
  function render(){
    const quit=document.getElementById('endGame');
    quit.hidden=state==='welcome';
    quit.onclick=()=>{if(confirm('End this match and return to the main menu? All progress will be lost.'))resetGame();};
    if(state==='welcome')viewIntro();
    else if(state==='handoffSetup'||state==='handoffTurn')viewHandoff();
    else if(state==='setup')viewSetup();
    else if(state==='turn')viewTurn();
    else if(state==='result')viewResult();
    else if(state==='misfire')viewMisfire();
    else if(state==='aiThinking')viewAiThinking();
    else if(state==='aiResult')viewAiResult();
  }
  render();
})();
</script></body></html>
